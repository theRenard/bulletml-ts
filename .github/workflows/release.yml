name: Release
# Publishes to npm when you push a tag like v0.1.1. Uses npm Trusted Publishing (OIDC): no token needed.
# Setup once on npmjs.com: package -> Settings -> Trusted Publisher -> GitHub Actions
#   owner theRenard, repository bulletml-ts, workflow release.yml
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm publish --access public --provenance
