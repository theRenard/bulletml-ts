<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bulletml-ts playground</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header>
    <h1>bulletml-ts <span>playground</span></h1>
    <select id="examples" aria-label="Example"></select>
    <button id="play">Pause</button>
    <button id="step">Step</button>
    <button id="reset">Reset</button>
    <label>Speed <input id="speed" type="range" min="0.1" max="3" step="0.1" value="1" /></label>
    <label>Rank <input id="rank" type="range" min="0" max="1" step="0.05" value="0" /></label>
    <label>Seed <input id="seed" type="number" value="1" /></label>
    <button id="share">Copy share link</button>
    <button id="lua">Export Lua…</button>
  </header>
  <main>
    <section class="stage">
      <canvas id="canvas" width="480" height="640"></canvas>
      <div id="stats"></div>
      <p class="hint">Drag on the canvas to move the target the pattern aims at.</p>
    </section>
    <section class="editor">
      <div id="editor" aria-label="BulletML source"></div>
      <pre id="error" role="alert"></pre>
    </section>
  </main>
  <dialog id="luaDialog">
    <form method="dialog" class="luaHead">
      <strong>Export to Lua</strong>
      <label>Target
        <select id="luaTarget">
          <option value="pico8">PICO-8</option>
          <option value="lua">Plain Lua / LÖVE</option>
        </select>
      </label>
      <label><input id="luaRuntime" type="checkbox" checked /> include runtime</label>
      <button type="button" id="luaCopy">Copy</button>
      <button type="button" id="luaDownload">Download .lua</button>
      <button>Close</button>
    </form>
    <textarea id="luaOut" readonly spellcheck="false"></textarea>
  </dialog>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
